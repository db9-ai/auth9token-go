name: Runner canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  round-1:
    name: Runner canary 1
    runs-on:
      group: auth9token-go main
      labels: [self-hosted, linux, trusted-public-main, "arch:amd64", "ghr-ec2-vcpus:1"]
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Guard workspace disk
        uses: ./.github/actions/sys9-disk-guard
        with:
          path: ${{ github.workspace }}
          minimum_free_gib: "15"

      - name: Record sanitized runner evidence
        shell: bash
        env:
          CANARY_ROUND: "1"
          EXPECTED_LABELS: self-hosted,linux,trusted-public-main,arch:amd64,ghr-ec2-vcpus:1
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ARCH}" != "X64" ]]; then
            echo "runner canary: expected X64 architecture, got ${RUNNER_ARCH}" >&2
            exit 1
          fi
          available_kb="$(df -Pk "${GITHUB_WORKSPACE}" | awk 'NR == 2 {print $4}')"
          if [[ ! "${available_kb}" =~ ^[0-9]+$ ]]; then
            echo "runner canary: unable to read workspace free space" >&2
            exit 1
          fi
          echo "round=${CANARY_ROUND} labels=${EXPECTED_LABELS} architecture=${RUNNER_ARCH} available_kb=${available_kb} status=success"

