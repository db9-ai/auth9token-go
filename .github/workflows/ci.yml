name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork &&
        'ubuntu-latest' ||
        fromJSON('["self-hosted","linux","default","arch:amd64","ghr-ec2-vcpus:2"]')
      }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard workspace disk
        uses: ./.github/actions/sys9-disk-guard
        with:
          path: ${{ github.workspace }}
          minimum_free_gib: "15"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 -race ./...
